name: Proforma Invoice validation

on:
  push:
    branches:
      - feature/proforma-invoice-full-port
  pull_request:
    branches:
      - arena/0b6506e3-proglassautomation3-0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-regression:
    runs-on: windows-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Run shell UI consistency checks
        run: |
          python Theme/step1.d.tests/step1.d.18.LayoutSpacingChecks.py
          python Theme/step1.d.tests/step1.d.19.FileSizeChecks.py
          python step5.ProjectRecords/step5.f.tests/step5.f.1.ProjectSourceChecks.py

      - name: Run Proforma Invoice source safety gate
        run: python step6.ProformaInvoice/step6.f.tests/step6.f.1.ProformaInvoiceSourceChecks.py

      - name: Restore WPF application
        run: dotnet restore ProGlassAutomation.csproj

      - name: Build WPF application
        run: dotnet build ProGlassAutomation.csproj --no-restore --configuration Release

      - name: Run Proforma Invoice regression suite
        run: dotnet run --project step6.ProformaInvoice/step6.f.tests/step6.f.ProformaTests.csproj --configuration Release
